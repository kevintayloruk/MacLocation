name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent MacLocation.app MacLocation.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacLocation
          path: build/MacLocation.zip
